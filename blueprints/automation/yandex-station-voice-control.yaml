blueprint:
  name: Yandex Station Voice Control
  author: to4kin
  homeassistant:
    min_version: "2025.1.0"
  source_url: https://github.com/to4kin/home-assistant/blob/main/blueprints/automation/yandex-station-voice-control.yaml
  description: |
    **Version**: 1.2.2

    Control any entity using voice commands from Yandex Station.

    **Features**:
    - Control any entity (switch, light, fan, cover, script, etc.)
    - Multiple entities support
    - Source station filtering (optional)
    - Turn on, turn off, and toggle commands (optional)
    - Per-action delays (optional)
    - Commands are queued and processed in arrival order
    - Mobile notifications (optional)
    - TTS confirmation (optional)
    - Logbook entries (optional)

    **Requires**: [Yandex Station](https://github.com/AlexxIT/YandexStation) integration (HACS).
  domain: automation
  input:
    # Main Settings
    main_section:
      name: Main Settings
      icon: mdi:target
      collapsed: false
      input:
        target_entities:
          name: 🎯 Target Entities
          description: >
            The entities to control with voice commands.
            Supports switch, light, fan, cover, script, etc.
          selector:
            entity:
              multiple: true

        source_stations:
          name: 🔊 Source Stations (Optional)
          description: >
            Optional. Only listen to commands from these Yandex Stations.
            Leave empty to listen to all stations.
          default: []
          selector:
            entity:
              filter:
                - domain: media_player
              multiple: true

    # Voice Commands
    voice_section:
      name: Voice Commands
      icon: mdi:microphone
      collapsed: true
      input:
        turn_on_command:
          name: ▶️ Turn On Command (Optional)
          description: >
            Optional. The command from Yandex Station that will turn on the entities.
            Leave empty to disable.
          default: ""
          selector:
            text:

        turn_on_delay:
          name: ⏱️ Turn On Delay
          description: Wait this duration before turning on.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        turn_off_command:
          name: ⏹️ Turn Off Command (Optional)
          description: >
            Optional. The command from Yandex Station that will turn off the entities.
            Leave empty to disable.
          default: ""
          selector:
            text:

        turn_off_delay:
          name: ⏱️ Turn Off Delay
          description: Wait this duration before turning off.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

        toggle_command:
          name: 🔁 Toggle Command (Optional)
          description: >
            Optional. The command from Yandex Station that will toggle the entities.
            Leave empty to disable.
          default: ""
          selector:
            text:

        toggle_delay:
          name: ⏱️ Toggle Delay
          description: Wait this duration before toggling.
          default:
            hours: 0
            minutes: 0
            seconds: 0
          selector:
            duration:

    # Notifications
    notification_section:
      name: Notifications
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_devices:
          name: 📲 Notification Devices (Optional)
          description: >
            Select mobile devices to receive notifications.
            Leave empty to disable.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

        notify_title:
          name: ✏️ Notification Title
          description: Title for mobile notifications.
          default: "Yandex Station"
          selector:
            text:

        notify_message_on:
          name: ▶️ Notification Message (On)
          description: >
            Custom notification message when turning on. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
          default: "Turned on"
          selector:
            text:

        notify_message_off:
          name: ⏹️ Notification Message (Off)
          description: >
            Custom notification message when turning off. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
          default: "Turned off"
          selector:
            text:

        notify_message_toggle:
          name: 🔁 Notification Message (Toggle)
          description: >
            Custom notification message when toggling. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
          default: "Toggled"
          selector:
            text:

    # TTS Confirmation
    tts_section:
      name: TTS Confirmation
      icon: mdi:account-voice
      collapsed: true
      input:
        tts_entity:
          name: 🗣️ Yandex Station for TTS (Optional)
          description: >
            Select Yandex Station media player for voice confirmation.
            Leave empty to disable.
          default: []
          selector:
            entity:
              filter:
                - domain: media_player

        tts_confirm_on:
          name: ▶️ Confirmation Message (On)
          description: >
            Message to speak when turning on. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
            Note: Use Russian for Yandex Station TTS.
          default: "Turned on"
          selector:
            text:

        tts_confirm_off:
          name: ⏹️ Confirmation Message (Off)
          description: >
            Message to speak when turning off. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
            Note: Use Russian for Yandex Station TTS.
          default: "Turned off"
          selector:
            text:

        tts_confirm_toggle:
          name: 🔁 Confirmation Message (Toggle)
          description: >
            Message to speak when toggling. Available variables:
            {{ device_names }} - friendly names of target entities,
            {{ entity_ids }} - entity IDs of target entities.
            Note: Use Russian for Yandex Station TTS.
          default: "Toggled"
          selector:
            text:

    # Logging
    logging_section:
      name: Logging
      icon: mdi:notebook-outline
      collapsed: true
      input:
        enable_logbook:
          name: 📓 Enable Logbook
          description: Log actions to Home Assistant logbook.
          default: true
          selector:
            boolean:

variables:
  # Core inputs
  target_entities: !input target_entities
  source_stations: !input source_stations
  notify_devices: !input notify_devices
  tts_entity: !input tts_entity
  turn_on_cmd: !input turn_on_command
  turn_off_cmd: !input turn_off_command
  toggle_cmd: !input toggle_command
  enable_logbook: !input enable_logbook
  notify_title: !input notify_title
  # Template variables - MUST be before message inputs
  device_names: >
    {{ target_entities | map('state_attr', 'friendly_name') | select('string') | join(', ') }}
  entity_ids: >
    {{ target_entities | join(', ') }}
  # Derived variables
  has_notify: "{{ notify_devices | length > 0 }}"
  has_tts: "{{ tts_entity != [] and tts_entity != '' }}"
  has_source_filter: "{{ source_stations | length > 0 }}"
  event_entity: "{{ trigger.event.data.entity_id | default('', true) }}"
  event_value: "{{ trigger.event.data.value | default('', true) }}"
  is_valid_source: "{{ not has_source_filter or event_entity in source_stations }}"
  is_valid_command: >-
    {{ event_value is string
       and ((turn_on_cmd != '' and event_value == turn_on_cmd)
         or (turn_off_cmd != '' and event_value == turn_off_cmd)
         or (toggle_cmd != '' and event_value == toggle_cmd)) }}
  # Message inputs - read AFTER template variables are defined
  tts_confirm_on: !input tts_confirm_on
  tts_confirm_off: !input tts_confirm_off
  tts_confirm_toggle: !input tts_confirm_toggle
  notify_msg_on: !input notify_message_on
  notify_msg_off: !input notify_message_off
  notify_msg_toggle: !input notify_message_toggle

trigger:
  - platform: event
    event_type: yandex_speaker
    id: voice_command

condition:
  - condition: template
    value_template: "{{ is_valid_source }}"
  - condition: template
    value_template: "{{ is_valid_command }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ turn_on_cmd != '' and event_value == turn_on_cmd }}"
        sequence:
          - delay: !input turn_on_delay
          - action: homeassistant.turn_on
            target:
              entity_id: !input target_entities
          - if:
              - condition: template
                value_template: "{{ enable_logbook }}"
            then:
              - action: logbook.log
                data:
                  name: "Yandex Station"
                  message: "Turned on {{ device_names }}"
          - if:
              - condition: template
                value_template: "{{ has_tts }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: "{{ tts_entity }}"
                data:
                  media_content_id: "{{ tts_confirm_on }}"
                  media_content_type: "text"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ has_notify }}"
            then:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "{{ notify_title }}"
                        message: "{{ notify_msg_on }}"
                      continue_on_error: true

      - conditions:
          - condition: template
            value_template: "{{ turn_off_cmd != '' and event_value == turn_off_cmd }}"
        sequence:
          - delay: !input turn_off_delay
          - action: homeassistant.turn_off
            target:
              entity_id: !input target_entities
          - if:
              - condition: template
                value_template: "{{ enable_logbook }}"
            then:
              - action: logbook.log
                data:
                  name: "Yandex Station"
                  message: "Turned off {{ device_names }}"
          - if:
              - condition: template
                value_template: "{{ has_tts }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: "{{ tts_entity }}"
                data:
                  media_content_id: "{{ tts_confirm_off }}"
                  media_content_type: "text"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ has_notify }}"
            then:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "{{ notify_title }}"
                        message: "{{ notify_msg_off }}"
                      continue_on_error: true

      - conditions:
          - condition: template
            value_template: "{{ toggle_cmd != '' and event_value == toggle_cmd }}"
        sequence:
          - delay: !input toggle_delay
          - action: homeassistant.toggle
            target:
              entity_id: !input target_entities
          - if:
              - condition: template
                value_template: "{{ enable_logbook }}"
            then:
              - action: logbook.log
                data:
                  name: "Yandex Station"
                  message: "Toggled {{ device_names }}"
          - if:
              - condition: template
                value_template: "{{ has_tts }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: "{{ tts_entity }}"
                data:
                  media_content_id: "{{ tts_confirm_toggle }}"
                  media_content_type: "text"
                continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ has_notify }}"
            then:
              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "{{ notify_title }}"
                        message: "{{ notify_msg_toggle }}"
                      continue_on_error: true

mode: queued
max: 10
max_exceeded: warning
