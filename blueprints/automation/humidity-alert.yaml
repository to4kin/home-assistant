blueprint:
  name: Humidity Alert
  author: to4kin
  homeassistant:
    min_version: "2025.1.0"
  source_url: https://github.com/to4kin/home-assistant/blob/main/blueprints/automation/humidity-alert.yaml
  description: |
    **Version**: 1.2.0

    Monitors humidity sensors and sends alerts when humidity exceeds threshold.

    **Features**:
    - Monitor multiple humidity sensors
    - Room detection from sensor area/friendly name
    - Configurable humidity threshold (default: 60%)
    - Notifications use current humidity and weather values after the delay
    - Hysteresis recovery across gradual humidity changes
    - Outside humidity/temperature/rain checks (optional)
    - Presence awareness (optional)
    - Time-based filtering (optional)
    - Mobile notifications
    - "Humidity normalized" notification (optional)
    - TTS announcements (optional)
    - Logbook entries (optional)

    **Requires**: Assign humidity sensors to areas in Home Assistant for automatic room detection.
  domain: automation
  input:
    # Main Settings
    main_section:
      name: Main Settings
      icon: mdi:water-percent
      collapsed: false
      input:
        humidity_sensors:
          name: 💧 Humidity Sensors
          description: >
            Select humidity sensors to monitor.
            Each sensor should be assigned to an area for room detection.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity
              multiple: true

        humidity_threshold:
          name: 📊 Humidity Threshold
          description: >
            Alert when humidity exceeds this value (%).
          default: 60
          selector:
            number:
              min: 40
              max: 90
              step: 5
              unit_of_measurement: "%"

        humidity_threshold_duration:
          name: ⏱️ Threshold Duration
          description: >
            Humidity must stay above threshold for this duration before alerting.
            Helps avoid false alerts from temporary spikes.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:

        humidity_hysteresis:
          name: 📉 Hysteresis
          description: >
            Humidity must drop this much below threshold before a new alert can be sent.
            Prevents alert spam when humidity fluctuates around threshold.
          default: 5
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "%"

    # Weather Settings
    weather_section:
      name: Weather Settings
      icon: mdi:weather-partly-cloudy
      collapsed: true
      input:
        weather_entity:
          name: 🌤️ Weather Entity (Optional)
          description: >
            Weather entity for outside conditions check.
            Used to check rain, outside humidity, and temperature.
          default: []
          selector:
            entity:
              filter:
                - domain: weather

        outside_humidity_sensor:
          name: 💨 Outside Humidity Sensor (Optional)
          description: >
            Optional. Sensor for outside humidity.
            If not set, will try to get from weather entity.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        outside_temp_sensor:
          name: 🌡️ Outside Temperature Sensor (Optional)
          description: >
            Optional. Sensor for outside temperature.
            If not set, will try to get from weather entity.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        min_outside_temp:
          name: ❄️ Minimum Outside Temperature
          description: >
            Don't suggest opening windows if outside temperature is below this value.
          default: -10
          selector:
            number:
              min: -20
              max: 20
              step: 1
              unit_of_measurement: "°C"

        check_rain:
          name: 🌧️ Check for Rain
          description: >
            Don't suggest opening windows if it's raining.
          default: true
          selector:
            boolean:

    # Presence Settings
    presence_section:
      name: Presence Settings
      icon: mdi:account-group
      collapsed: true
      input:
        presence_entities:
          name: 👥 Presence Entities (Optional)
          description: >
            Person entities to check presence.
            Alerts only sent when at least one person is home.
            Leave empty to always send alerts.
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true

    # Time Filter
    time_section:
      name: Time Filter
      icon: mdi:clock-outline
      collapsed: true
      input:
        enable_time_filter:
          name: 🕔 Enable Time Filter (Optional)
          description: >
            Only send alerts during specified hours.
          default: false
          selector:
            boolean:

        time_start:
          name: ☀️ Alert Start Time
          description: >
            Start sending alerts at this time.
          default: "08:00:00"
          selector:
            time:

        time_end:
          name: 🌙 Alert End Time
          description: >
            Stop sending alerts at this time.
          default: "22:00:00"
          selector:
            time:

    # Notifications
    notification_section:
      name: Notifications
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_devices:
          name: 📲 Notification Devices
          description: >
            Mobile devices to send notifications to.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

        notify_title:
          name: ✏️ Notification Title
          description: >
            Title for the notification.
          default: "High Humidity Alert"
          selector:
            text:

        notify_message:
          name: 💬 Notification Message
          description: >
            Message template. Available variables:
            {{ device_name }} - sensor friendly name,
            {{ entity_id }} - sensor entity ID,
            {{ room_name }} - area name (or friendly name if no area),
            {{ humidity }} - current humidity %,
            {{ threshold }} - configured threshold %.
          default: "Humidity in {{ room_name }} is {{ humidity }}% (threshold: {{ threshold }}%). Consider opening a window for ventilation."
          selector:
            text:
              multiline: true

        notify_message_weather:
          name: 🌤️ Weather Advisory Message
          description: >
            Additional message when weather conditions are not ideal for opening windows.
          default: "⚠️ Note: Current weather conditions may not be ideal for ventilation."
          selector:
            text:
              multiline: true

        notify_normalized:
          name: ✅ Notify When Normalized (Optional)
          description: >
            Send notification when humidity returns to normal level.
          default: false
          selector:
            boolean:

        notify_message_normalized:
          name: 💬 Normalized Message
          description: >
            Message when humidity returns to normal. Available variables:
            {{ device_name }} - sensor friendly name,
            {{ entity_id }} - sensor entity ID,
            {{ room_name }} - area name (or friendly name if no area),
            {{ humidity }} - current humidity %,
            {{ threshold }} - configured threshold %.
          default: "Humidity in {{ room_name }} is back to normal ({{ humidity }}%)."
          selector:
            text:
              multiline: true

    # TTS Announcements
    tts_section:
      name: TTS Announcements
      icon: mdi:account-voice
      collapsed: true
      input:
        enable_tts:
          name: 🔊 Enable TTS (Optional)
          description: >
            Announce alerts via TTS-capable media player (Alexa, Google Home, Yandex Station, etc.).
          default: false
          selector:
            boolean:

        tts_target:
          name: 🎙️ TTS Target
          description: >
            Required when TTS is enabled. Media player for TTS announcements.
          default: []
          selector:
            entity:
              filter:
                - domain: media_player

        tts_message:
          name: 💬 TTS Message
          description: >
            TTS message template. Available variables:
            {{ device_name }} - sensor friendly name,
            {{ entity_id }} - sensor entity ID,
            {{ room_name }} - area name (or friendly name if no area),
            {{ humidity }} - current humidity %,
            {{ threshold }} - configured threshold %.
            Note: For Yandex Station, use Russian language.
          default: "Attention! Humidity in {{ room_name }} is {{ humidity }} percent. Consider opening a window for ventilation."
          selector:
            text:
              multiline: true

    # Logging
    logging_section:
      name: Logging
      icon: mdi:notebook-outline
      collapsed: true
      input:
        enable_logbook:
          name: 📓 Enable Logbook
          description: Log humidity alerts to Home Assistant logbook.
          default: true
          selector:
            boolean:

variables:
  humidity_sensors: !input humidity_sensors
  humidity_threshold: !input humidity_threshold
  humidity_hysteresis: !input humidity_hysteresis
  weather_entity: !input weather_entity
  outside_humidity_sensor: !input outside_humidity_sensor
  outside_temp_sensor: !input outside_temp_sensor
  min_outside_temp: !input min_outside_temp
  check_rain: !input check_rain
  presence_entities: !input presence_entities
  notify_devices: !input notify_devices
  notify_title: !input notify_title
  notify_normalized: !input notify_normalized
  enable_tts: !input enable_tts
  tts_target: !input tts_target
  enable_time_filter: !input enable_time_filter
  enable_logbook: !input enable_logbook
  entity_id: "{{ trigger.entity_id | default('', true) }}"
  old_humidity_is_numeric: >-
    {{ trigger.from_state is defined and trigger.from_state is not none
       and is_number(trigger.from_state.state) }}
  new_humidity_is_numeric: >-
    {{ trigger.to_state is defined and trigger.to_state is not none
       and is_number(trigger.to_state.state) }}
  previous_humidity: >-
    {{ trigger.from_state.state | float if old_humidity_is_numeric else none }}
  current_humidity: >-
    {{ trigger.to_state.state | float if new_humidity_is_numeric else none }}
  crossed_threshold: >-
    {{ old_humidity_is_numeric and new_humidity_is_numeric
       and previous_humidity <= humidity_threshold
       and current_humidity > humidity_threshold }}
trigger:
  - platform: state
    entity_id: !input humidity_sensors
    id: humidity_change

condition:
  - condition: template
    value_template: "{{ crossed_threshold }}"

action:
  - delay: !input humidity_threshold_duration

  - variables:
      alert_humidity_state: "{{ states(entity_id) }}"

  - condition: template
    value_template: >-
      {{ is_number(alert_humidity_state)
         and alert_humidity_state | float > humidity_threshold }}

  - condition: template
    value_template: >-
      {% if presence_entities | length == 0 %}
        true
      {% else %}
        {{ presence_entities | expand
           | selectattr('state', 'eq', 'home') | list | count > 0 }}
      {% endif %}

  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not enable_time_filter }}"
      - condition: time
        after: !input time_start
        before: !input time_end

  - variables:
      alert_humidity: "{{ alert_humidity_state | float }}"
      humidity: "{{ alert_humidity }}"
      threshold: "{{ humidity_threshold }}"
      device_name: >-
        {{ state_attr(entity_id, 'friendly_name') | default(entity_id, true) }}
      room_name: >-
        {{ area_name(entity_id)
           | default(state_attr(entity_id, 'friendly_name'), true)
           | default(entity_id, true) }}
      outside_humidity_raw: >-
        {% if outside_humidity_sensor %}
          {{ states(outside_humidity_sensor) }}
        {% elif weather_entity %}
          {{ state_attr(weather_entity, 'humidity') }}
        {% else %}
          {{ none }}
        {% endif %}
      outside_temp_raw: >-
        {% if outside_temp_sensor %}
          {{ states(outside_temp_sensor) }}
        {% elif weather_entity %}
          {{ state_attr(weather_entity, 'temperature') }}
        {% else %}
          {{ none }}
        {% endif %}

  - variables:
      alert_weather_ok: >-
        {% set weather_configured = outside_humidity_sensor
           or outside_temp_sensor or weather_entity %}
        {{ not weather_configured or
           (is_number(outside_humidity_raw) and is_number(outside_temp_raw)
            and (outside_humidity_raw | float) < alert_humidity
            and (outside_temp_raw | float) >= min_outside_temp
            and (not check_rain or not weather_entity or
                 states(weather_entity) not in ['rainy', 'pouring', 'snowy',
                   'snowy-rainy', 'hail', 'lightning-rainy'])) }}

  - variables:
      alert_notify_msg: !input notify_message
      alert_weather_msg: !input notify_message_weather
      alert_tts_message: !input tts_message

  - if:
      - condition: template
        value_template: "{{ enable_logbook }}"
    then:
      - action: logbook.log
        data:
          name: "Humidity Alert"
          message: >-
            {{ room_name }}: {{ alert_humidity }}% (threshold:
            {{ humidity_threshold }}%){{ ' - Weather OK' if alert_weather_ok
            else ' - Weather not ideal' }}

  - repeat:
      for_each: !input notify_devices
      sequence:
        - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "💧 {{ notify_title }}"
            message: >-
              {{ alert_notify_msg }}
              {% if not alert_weather_ok %}

              {{ alert_weather_msg }}
              {% endif %}
            data:
              tag: "humidity_alert_{{ entity_id | slugify }}"
              group: "humidity_alerts"
          continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ enable_tts and tts_target }}"
    then:
      - action: media_player.play_media
        target:
          entity_id: "{{ tts_target }}"
        data:
          media_content_id: "{{ alert_tts_message }}"
          media_content_type: text
          extra:
            volume_level: 0.5
        continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ notify_normalized }}"
    then:
      - wait_template: >-
          {{ is_number(states(entity_id))
             and states(entity_id) | float
                 <= humidity_threshold - humidity_hysteresis }}

      - variables:
          recovery_humidity: "{{ states(entity_id) | float }}"
          humidity: "{{ recovery_humidity }}"
          threshold: "{{ humidity_threshold }}"

      - condition: template
        value_template: >-
          {% if presence_entities | length == 0 %}
            true
          {% else %}
            {{ presence_entities | expand
               | selectattr('state', 'eq', 'home') | list | count > 0 }}
          {% endif %}

      - condition: or
        conditions:
          - condition: template
            value_template: "{{ not enable_time_filter }}"
          - condition: time
            after: !input time_start
            before: !input time_end

      - variables:
          recovery_notify_msg: !input notify_message_normalized

      - if:
          - condition: template
            value_template: "{{ enable_logbook }}"
        then:
          - action: logbook.log
            data:
              name: "Humidity Normal"
              message: "{{ room_name }}: {{ recovery_humidity }}% - Back to normal"

      - repeat:
          for_each: !input notify_devices
          sequence:
            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
              data:
                title: "✅ Humidity Normal"
                message: "{{ recovery_notify_msg }}"
                data:
                  tag: "humidity_alert_{{ entity_id | slugify }}"
                  group: "humidity_alerts"
              continue_on_error: true

mode: parallel
max: 50
max_exceeded: warning
