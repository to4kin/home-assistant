blueprint:
  name: Humidity Room Monitor
  author: to4kin
  homeassistant:
    min_version: "2025.1.0"
  source_url: https://github.com/to4kin/home-assistant/blob/main/blueprints/automation/humidity-room-monitor.yaml
  description: |
    **Version**: 2.0.0

    Monitors one room with independent mould and condensation risk lifecycles.

    **Features**:
    - Sustained mould alert at a configurable warning or danger level
    - Optional condensation alert using indoor temperature and weather data
    - Hysteresis-based recovery notifications
    - Room name derived from the humidity sensor area
    - Presence and overnight time-window filters
    - Mobile notifications, TTS, and logbook entries

    **Breaking change**: Version 2.0 removes the room and helper inputs.
    Recreate existing automation instances after importing this version.

    **Note**: A risk already active when the automation loads must normalize
    before it can trigger. Reloading Home Assistant or the automation cancels
    lifecycles that are waiting for recovery.
  domain: automation
  input:
    main_section:
      name: Room Measurements
      icon: mdi:home-thermometer
      collapsed: false
      input:
        humidity_sensor:
          name: 💧 Humidity Sensor
          description: The sensor area is used as the room name.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        temperature_sensor:
          name: 🌡️ Indoor Temperature Sensor (Optional)
          description: Required together with a weather entity for condensation alerts.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        weather_entity:
          name: 🌤️ Weather Entity (Optional)
          description: Supplies outdoor temperature, humidity, and precipitation state.
          default: []
          selector:
            entity:
              filter:
                - domain: weather

    risk_section:
      name: Risk Thresholds
      icon: mdi:alert-outline
      collapsed: false
      input:
        mould_warning_threshold:
          name: 📊 Mould Warning Threshold
          default: 60
          selector:
            number:
              min: 40
              max: 80
              step: 1
              unit_of_measurement: "%"

        mould_danger_threshold:
          name: 🚨 Mould Danger Threshold
          description: Set this above the warning threshold.
          default: 70
          selector:
            number:
              min: 50
              max: 90
              step: 1
              unit_of_measurement: "%"

        notify_level:
          name: 🚨 Notify Starting From Level
          default: "Warning"
          selector:
            select:
              options:
                - "Warning"
                - "Danger"

        mould_hysteresis:
          name: 📉 Mould Recovery Hysteresis
          description: Humidity must fall this far below the selected alert threshold.
          default: 5
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "%"

        window_temp_offset:
          name: 🪟 Window Temperature Offset
          description: Estimated window surface temperature above outdoor temperature.
          default: 3
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"

        condensation_warning_margin:
          name: 💨 Condensation Warning Margin
          description: Alert when window temperature is this close to the dew point.
          default: 3
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"

        condensation_hysteresis:
          name: 📈 Condensation Recovery Hysteresis
          description: Margin must rise this far above the warning margin.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"

        min_outside_temp:
          name: ❄️ Minimum Ventilation Temperature
          default: -10
          selector:
            number:
              min: -20
              max: 20
              step: 1
              unit_of_measurement: "°C"

        alert_delay:
          name: ⏱️ Sustained Risk Delay
          description: Risk must remain active for this duration before alerting.
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:

    filter_section:
      name: Presence and Time
      icon: mdi:filter-outline
      collapsed: true
      input:
        presence_entities:
          name: 👥 Presence Entities (Optional)
          description: Leave empty to alert regardless of presence.
          default: []
          selector:
            entity:
              filter:
                - domain: person
              multiple: true

        enable_time_filter:
          name: 🕔 Enable Time Filter
          default: false
          selector:
            boolean:

        time_start:
          name: ☀️ Alert Start Time
          default: "08:00:00"
          selector:
            time:

        time_end:
          name: 🌙 Alert End Time
          default: "22:00:00"
          selector:
            time:

    notification_section:
      name: Notifications
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_devices:
          name: 📲 Notification Devices
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

        notify_title:
          name: ✏️ Notification Title
          default: "Room Humidity Risk"
          selector:
            text:

        notify_message_mould:
          name: 💬 Mould Alert Message
          description: >
            Variables: {{ room_name }}, {{ humidity }}, and {{ mould_risk }}.
          default: "Mould risk in {{ room_name }} is {{ mould_risk }} at {{ humidity }}% humidity."
          selector:
            text:
              multiline: true

        notify_message_condensation:
          name: 💬 Condensation Alert Message
          description: >
            Variables: {{ room_name }}, {{ humidity }}, {{ dew_point }}, and
            {{ condensation_margin }}.
          default: "Condensation risk in {{ room_name }}: margin {{ condensation_margin }}°C."
          selector:
            text:
              multiline: true

        notify_message_weather:
          name: 🌤️ Weather Advisory Message
          default: "⚠️ Current weather is not suitable for ventilation."
          selector:
            text:
              multiline: true

        notify_normalized:
          name: ✅ Notify When Risk Normalizes
          default: false
          selector:
            boolean:

        notify_message_normalized:
          name: ✅ Normalized Message
          description: "Variables: {{ room_name }}, {{ humidity }}, and {{ risk_type }}."
          default: "{{ risk_type }} risk in {{ room_name }} is back to normal."
          selector:
            text:
              multiline: true

    tts_section:
      name: TTS Announcements
      icon: mdi:account-voice
      collapsed: true
      input:
        enable_tts:
          name: 🔊 Enable TTS
          default: false
          selector:
            boolean:

        tts_target:
          name: 🎙️ TTS Target
          default: []
          selector:
            entity:
              filter:
                - domain: media_player

        tts_message_mould:
          name: 🗣️ Mould TTS Message
          default: "Mould risk in {{ room_name }}. Humidity is {{ humidity }} percent."
          selector:
            text:
              multiline: true

        tts_message_condensation:
          name: 🗣️ Condensation TTS Message
          default: "Condensation risk in {{ room_name }}."
          selector:
            text:
              multiline: true

    logging_section:
      name: Logging
      icon: mdi:notebook-outline
      collapsed: true
      input:
        enable_logbook:
          name: 📓 Enable Logbook
          default: true
          selector:
            boolean:

trigger_variables:
  humidity_sensor: !input humidity_sensor
  temperature_sensor: !input temperature_sensor
  weather_entity: !input weather_entity
  mould_warning_threshold: !input mould_warning_threshold
  mould_danger_threshold: !input mould_danger_threshold
  notify_level: !input notify_level
  window_temp_offset: !input window_temp_offset
  condensation_warning_margin: !input condensation_warning_margin

trigger:
  - platform: template
    value_template: >-
      {% set mould_threshold = mould_danger_threshold
         if notify_level == 'Danger' else mould_warning_threshold %}
      {{ is_number(states(humidity_sensor))
         and states(humidity_sensor) | float >= mould_threshold }}
    for: !input alert_delay
    id: mould_risk

  - platform: template
    value_template: >-
      {% set humidity_valid = is_number(states(humidity_sensor)) %}
      {% set indoor_valid = temperature_sensor
         and is_number(states(temperature_sensor)) %}
      {% set outdoor_valid = weather_entity
         and is_number(state_attr(weather_entity, 'temperature')) %}
      {% if humidity_valid and indoor_valid and outdoor_valid %}
        {% set humidity = states(humidity_sensor) | float %}
        {% set indoor = states(temperature_sensor) | float %}
        {% set outdoor = state_attr(weather_entity, 'temperature') | float %}
        {% set dew_point = indoor - ((100 - humidity) / 5) %}
        {% set margin = outdoor + window_temp_offset - dew_point %}
        {{ margin <= condensation_warning_margin }}
      {% else %}
        false
      {% endif %}
    for: !input alert_delay
    id: condensation_risk

variables:
  humidity_sensor: !input humidity_sensor
  temperature_sensor: !input temperature_sensor
  weather_entity: !input weather_entity
  mould_warning_threshold: !input mould_warning_threshold
  mould_danger_threshold: !input mould_danger_threshold
  notify_level: !input notify_level
  mould_hysteresis: !input mould_hysteresis
  window_temp_offset: !input window_temp_offset
  condensation_warning_margin: !input condensation_warning_margin
  condensation_hysteresis: !input condensation_hysteresis
  min_outside_temp: !input min_outside_temp
  presence_entities: !input presence_entities
  enable_time_filter: !input enable_time_filter
  notify_devices: !input notify_devices
  notify_title: !input notify_title
  notify_normalized: !input notify_normalized
  enable_tts: !input enable_tts
  tts_target: !input tts_target
  enable_logbook: !input enable_logbook
  room_name: >-
    {{ area_name(humidity_sensor)
       | default(state_attr(humidity_sensor, 'friendly_name'), true)
       | default(humidity_sensor, true) }}
  humidity_value: >-
    {{ states(humidity_sensor) | float
       if is_number(states(humidity_sensor)) else none }}
  indoor_temp: >-
    {{ states(temperature_sensor) | float
       if temperature_sensor and is_number(states(temperature_sensor)) else none }}
  outdoor_temp: >-
    {{ state_attr(weather_entity, 'temperature') | float
       if weather_entity
          and is_number(state_attr(weather_entity, 'temperature')) else none }}
  outdoor_humidity: >-
    {{ state_attr(weather_entity, 'humidity') | float
       if weather_entity
          and is_number(state_attr(weather_entity, 'humidity')) else none }}
  mould_threshold: >-
    {{ mould_danger_threshold if notify_level == 'Danger'
       else mould_warning_threshold }}
  mould_risk: >-
    {% if humidity_value is none %}Unknown
    {% elif humidity_value >= mould_danger_threshold %}Danger
    {% elif humidity_value >= mould_warning_threshold %}Warning
    {% else %}OK{% endif %}
  dew_point: >-
    {{ indoor_temp - ((100 - humidity_value) / 5)
       if humidity_value is not none and indoor_temp is not none else none }}
  condensation_margin: >-
    {{ outdoor_temp + window_temp_offset - dew_point
       if outdoor_temp is not none and dew_point is not none else none }}
  weather_ok: >-
    {% if outdoor_temp is none or outdoor_humidity is none
          or humidity_value is none %}
      {{ none }}
    {% else %}
      {{ outdoor_temp >= min_outside_temp
         and outdoor_humidity < humidity_value
         and states(weather_entity) not in ['rainy', 'pouring', 'snowy',
           'snowy-rainy', 'hail', 'lightning-rainy'] }}
    {% endif %}

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: mould_risk
        sequence:
          - condition: template
            value_template: >-
              {{ is_number(states(humidity_sensor))
                 and states(humidity_sensor) | float >= mould_threshold }}

          - condition: template
            value_template: >-
              {{ presence_entities | length == 0 or
                 presence_entities | expand
                   | selectattr('state', 'eq', 'home') | list | count > 0 }}

          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not enable_time_filter }}"
              - condition: time
                after: !input time_start
                before: !input time_end

          - variables:
              humidity: "{{ states(humidity_sensor) | float }}"
              mould_risk: >-
                {% if humidity >= mould_danger_threshold %}Danger
                {% elif humidity >= mould_warning_threshold %}Warning
                {% else %}OK{% endif %}
              risk_type: "Mould"

          - variables:
              mould_notify_msg: !input notify_message_mould
              weather_notify_msg: !input notify_message_weather
              mould_tts_msg: !input tts_message_mould

          - if:
              - condition: template
                value_template: "{{ enable_logbook }}"
            then:
              - action: logbook.log
                data:
                  name: "Mould Risk"
                  message: >-
                    {{ room_name }}: {{ mould_risk }}, humidity {{ humidity }}%

          - repeat:
              for_each: !input notify_devices
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    title: "💧 {{ notify_title }}"
                    message: >-
                      {{ mould_notify_msg }}
                      {% if weather_ok is false %}

                      {{ weather_notify_msg }}
                      {% endif %}
                    data:
                      tag: "humidity_room_mould_{{ humidity_sensor | slugify }}"
                      group: "humidity_room_risks"
                  continue_on_error: true

          - if:
              - condition: template
                value_template: "{{ enable_tts and tts_target }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: "{{ tts_target }}"
                data:
                  media_content_id: "{{ mould_tts_msg }}"
                  media_content_type: text
                  extra:
                    volume_level: 0.5
                continue_on_error: true

          - if:
              - condition: template
                value_template: "{{ notify_normalized }}"
            then:
              - wait_template: >-
                  {{ is_number(states(humidity_sensor))
                     and states(humidity_sensor) | float
                         <= mould_threshold - mould_hysteresis }}

              - variables:
                  humidity: "{{ states(humidity_sensor) | float }}"
                  risk_type: "Mould"

              - condition: template
                value_template: >-
                  {{ presence_entities | length == 0 or
                     presence_entities | expand
                       | selectattr('state', 'eq', 'home') | list | count > 0 }}

              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ not enable_time_filter }}"
                  - condition: time
                    after: !input time_start
                    before: !input time_end

              - variables:
                  normalized_notify_msg: !input notify_message_normalized

              - if:
                  - condition: template
                    value_template: "{{ enable_logbook }}"
                then:
                  - action: logbook.log
                    data:
                      name: "Mould Risk Normal"
                      message: "{{ room_name }}: humidity {{ humidity }}%"

              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "✅ {{ notify_title }}"
                        message: "{{ normalized_notify_msg }}"
                        data:
                          tag: "humidity_room_mould_{{ humidity_sensor | slugify }}"
                          group: "humidity_room_risks"
                      continue_on_error: true

      - conditions:
          - condition: trigger
            id: condensation_risk
        sequence:
          - variables:
              current_condensation_margin: >-
                {% set humidity_valid = is_number(states(humidity_sensor)) %}
                {% set indoor_valid = temperature_sensor
                   and is_number(states(temperature_sensor)) %}
                {% set outdoor_valid = weather_entity
                   and is_number(state_attr(weather_entity, 'temperature')) %}
                {% if humidity_valid and indoor_valid and outdoor_valid %}
                  {% set humidity = states(humidity_sensor) | float %}
                  {% set indoor = states(temperature_sensor) | float %}
                  {% set outdoor = state_attr(weather_entity, 'temperature') | float %}
                  {% set dew_point = indoor - ((100 - humidity) / 5) %}
                  {{ outdoor + window_temp_offset - dew_point }}
                {% else %}
                  {{ none }}
                {% endif %}

          - condition: template
            value_template: >-
              {{ current_condensation_margin is not none
                 and current_condensation_margin <= condensation_warning_margin }}

          - condition: template
            value_template: >-
              {{ presence_entities | length == 0 or
                 presence_entities | expand
                   | selectattr('state', 'eq', 'home') | list | count > 0 }}

          - condition: or
            conditions:
              - condition: template
                value_template: "{{ not enable_time_filter }}"
              - condition: time
                after: !input time_start
                before: !input time_end

          - variables:
              humidity: "{{ states(humidity_sensor) | float }}"
              indoor_temp: "{{ states(temperature_sensor) | float }}"
              outdoor_temp: "{{ state_attr(weather_entity, 'temperature') | float }}"
              dew_point: "{{ indoor_temp - ((100 - humidity) / 5) }}"
              condensation_margin: >-
                {{ outdoor_temp + window_temp_offset - dew_point }}
              risk_type: "Condensation"

          - variables:
              condensation_notify_msg: !input notify_message_condensation
              weather_notify_msg: !input notify_message_weather
              condensation_tts_msg: !input tts_message_condensation

          - if:
              - condition: template
                value_template: "{{ enable_logbook }}"
            then:
              - action: logbook.log
                data:
                  name: "Condensation Risk"
                  message: >-
                    {{ room_name }}: margin {{ condensation_margin | round(1) }}°C

          - repeat:
              for_each: !input notify_devices
              sequence:
                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                  data:
                    title: "💧 {{ notify_title }}"
                    message: >-
                      {{ condensation_notify_msg }}
                      {% if weather_ok is false %}

                      {{ weather_notify_msg }}
                      {% endif %}
                    data:
                      tag: "humidity_room_condensation_{{ humidity_sensor | slugify }}"
                      group: "humidity_room_risks"
                  continue_on_error: true

          - if:
              - condition: template
                value_template: "{{ enable_tts and tts_target }}"
            then:
              - action: media_player.play_media
                target:
                  entity_id: "{{ tts_target }}"
                data:
                  media_content_id: "{{ condensation_tts_msg }}"
                  media_content_type: text
                  extra:
                    volume_level: 0.5
                continue_on_error: true

          - if:
              - condition: template
                value_template: "{{ notify_normalized }}"
            then:
              - wait_template: >-
                  {% set humidity_valid = is_number(states(humidity_sensor)) %}
                  {% set indoor_valid = temperature_sensor
                     and is_number(states(temperature_sensor)) %}
                  {% set outdoor_valid = weather_entity
                     and is_number(state_attr(weather_entity, 'temperature')) %}
                  {% if humidity_valid and indoor_valid and outdoor_valid %}
                    {% set humidity = states(humidity_sensor) | float %}
                    {% set indoor = states(temperature_sensor) | float %}
                    {% set outdoor = state_attr(weather_entity, 'temperature') | float %}
                    {% set dew_point = indoor - ((100 - humidity) / 5) %}
                    {{ outdoor + window_temp_offset - dew_point
                       > condensation_warning_margin + condensation_hysteresis }}
                  {% else %}
                    false
                  {% endif %}

              - variables:
                  humidity: "{{ states(humidity_sensor) | float }}"
                  risk_type: "Condensation"

              - condition: template
                value_template: >-
                  {{ presence_entities | length == 0 or
                     presence_entities | expand
                       | selectattr('state', 'eq', 'home') | list | count > 0 }}

              - condition: or
                conditions:
                  - condition: template
                    value_template: "{{ not enable_time_filter }}"
                  - condition: time
                    after: !input time_start
                    before: !input time_end

              - variables:
                  normalized_notify_msg: !input notify_message_normalized

              - if:
                  - condition: template
                    value_template: "{{ enable_logbook }}"
                then:
                  - action: logbook.log
                    data:
                      name: "Condensation Risk Normal"
                      message: "{{ room_name }}: condensation risk cleared"

              - repeat:
                  for_each: !input notify_devices
                  sequence:
                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                      data:
                        title: "✅ {{ notify_title }}"
                        message: "{{ normalized_notify_msg }}"
                        data:
                          tag: "humidity_room_condensation_{{ humidity_sensor | slugify }}"
                          group: "humidity_room_risks"
                      continue_on_error: true

mode: parallel
max: 4
max_exceeded: warning
