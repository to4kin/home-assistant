name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Ruby version
        run: ruby --version

      - name: Run Ruby tests
        run: bash scripts/test.sh
